<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chikitsa Follow</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/chikitsafollow-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/chikitsafollow-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/chikitsafollow-180.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Chikitsa Follow" />

    <meta name="theme-color" content="#137b72" />
    <meta name="description" content="ChikitsaFollow patient service support and clinic follow-up." />

    <!-- FOUC prevention: resolve the persisted theme before React mounts
         so dark-mode users don't see a light flash on reload. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("chikitsa:theme");
          var theme = stored === "dark" || stored === "light" ? stored : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
